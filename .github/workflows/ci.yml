name: QuoteFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    # Backend Tasks
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: Run Backend Unit Tests
      run: |
        cd backend
        npm run test

    - name: Build Backend
      run: |
        cd backend
        npm run build

    # Frontend Tasks
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Frontend
      run: |
        cd frontend
        npm run build